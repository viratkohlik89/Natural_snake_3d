<style>
/* =========================================================================
   Cards: modes, skins, arenas, achievements, stats, challenges
   ========================================================================= */
.grid{display:grid;gap:10px}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}

.card{
  position:relative;display:flex;flex-direction:column;gap:6px;
  padding:14px 15px;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.028);border:1px solid var(--line);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  color:var(--text);font-family:inherit;
  transition:background .18s ease,border-color .18s ease,transform .14s ease;
}
.card:hover,.card:focus-visible{background:rgba(255,255,255,.06);border-color:var(--line-2);outline:none}
.card:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.card:active{transform:scale(.985)}
.card.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 40px -18px var(--accent)}
.card.sel::after{
  content:"";position:absolute;top:0;right:0;width:0;height:0;
  border-top:16px solid var(--accent);border-left:16px solid transparent;
}
.card .t{font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.card .d{font-size:12px;color:var(--muted);line-height:1.4}
.card .meta{font-family:var(--font-m);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.card.locked{cursor:pointer;opacity:.62}
.card.locked .t{color:var(--muted)}
.card.locked:hover{border-color:var(--amber);opacity:.85}
.card .lock{
  position:absolute;top:10px;right:12px;font-family:var(--font-m);font-size:10px;
  letter-spacing:.1em;color:var(--amber);
}
.swatch{width:100%;height:26px;border:1px solid rgba(255,255,255,.16);margin-bottom:2px}
.mode-ico{width:26px;height:26px;color:var(--accent)}
.mode-ico path,.mode-ico circle,.mode-ico rect{fill:currentColor}

.ach{display:flex;gap:13px;align-items:center;padding:11px 13px;background:rgba(255,255,255,.026);border:1px solid var(--line);border-left:3px solid var(--dim)}
.ach.got{border-left-color:var(--accent);background:var(--accent-soft)}
.ach .badge{
  width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid var(--line-2);font-size:17px;filter:grayscale(1) opacity(.5);
}
.ach.got .badge{filter:none;border-color:var(--accent);box-shadow:0 0 20px -6px var(--accent)}
.ach .txt{flex:1 1 auto;min-width:0}
.ach .txt b{display:block;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase}
.ach .txt span{display:block;font-size:12px;color:var(--muted)}
.ach .tick{font-family:var(--font-m);font-size:11px;color:var(--accent);letter-spacing:.1em}

.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;background:rgba(255,255,255,.026);border:1px solid var(--line)}
.stat b{font-family:var(--font-m);font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.chal{display:flex;flex-direction:column;gap:7px;padding:11px 13px;background:rgba(255,255,255,.026);border:1px solid var(--line)}
.chal .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chal .top b{font-size:13px;letter-spacing:.06em;font-weight:600}
.chal .top i{font-family:var(--font-m);font-size:11px;color:var(--accent);font-style:normal}
.chal.done{border-color:var(--ok)}
.chal.done .top i{color:var(--ok)}
.pbar{height:3px;background:rgba(126,196,255,.16);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:width .3s ease}
.chal.done .pbar i{background:var(--ok);box-shadow:0 0 10px var(--ok)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.tabs button{
  font-family:var(--font-d);font-weight:600;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 15px;min-height:44px;color:var(--muted);background:transparent;border:0;border-bottom:2px solid transparent;cursor:pointer;
  transition:color .16s ease,border-color .16s ease;
}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.help h3{margin:22px 0 8px;color:var(--accent);letter-spacing:.2em}
.help h3:first-child{margin-top:0}
.help p{font-size:14px;color:var(--muted);max-width:62ch}
.help .kbd{
  display:inline-block;font-family:var(--font-m);font-size:11px;padding:2px 7px;margin:0 2px;
  border:1px solid var(--line-2);background:rgba(0,0,0,.35);color:var(--text);
}
.help .defs{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.help .def{padding:11px 13px;background:rgba(255,255,255,.026);border:1px solid var(--line)}
.help .def b{display:block;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.help .def span{font-size:12px;color:var(--muted)}

/* =========================================================================
   HUD
   ========================================================================= */
#hud{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;
  padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) calc(10px + var(--safe-b)) calc(12px + var(--safe-l));
  display:grid;
  grid-template-columns:1fr auto 1fr;
  grid-template-rows:auto 1fr auto;
  gap:8px;
}
#hud.on{opacity:1;visibility:visible}
.hud-box{
  pointer-events:none;
  background:linear-gradient(150deg,rgba(9,15,29,.62),rgba(6,10,20,.5));
  border:1px solid var(--line);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  padding:8px 12px;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
}
#hud-tl{grid-area:1/1/2/2;justify-self:start;display:flex;flex-direction:column;gap:4px}
#hud-tc{grid-area:1/2/2/3;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:6px}
#hud-tr{grid-area:1/3/2/4;justify-self:end;display:flex;align-items:flex-start;gap:8px}
#hud-bl{grid-area:3/1/4/2;justify-self:start;align-self:end;display:flex;flex-direction:column;gap:6px;max-width:min(300px,52vw)}
#hud-br{grid-area:3/3/4/4;justify-self:end;align-self:end}
.hud-l{font-family:var(--font-m);font-size:9.5px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;display:block}
.hud-v{font-family:var(--font-m);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
#hud-score{font-size:clamp(22px,4.4vmin,38px);color:#fff;text-shadow:0 0 22px rgba(255,255,255,.22)}
#hud-best{font-size:clamp(11px,1.8vmin,13px);color:var(--muted)}
#hud-level{font-size:clamp(13px,2.3vmin,17px);color:var(--accent)}
#hud-info{font-size:clamp(13px,2.3vmin,17px);color:var(--amber)}
#hud-tc .telemetry{width:clamp(120px,26vw,240px);height:22px;border-left-width:2px}
#combo{
  font-family:var(--font-d);font-weight:700;letter-spacing:.08em;
  font-size:clamp(18px,3.6vmin,30px);color:var(--magenta);
  text-shadow:0 0 26px var(--magenta);opacity:0;transform:scale(.6);
  transition:opacity .2s ease,transform .2s ease;
}
#combo.on{opacity:1;transform:none}
#combo.pop{animation:comboPop .42s cubic-bezier(.2,1.4,.3,1)}
@keyframes comboPop{0%{transform:scale(1)}28%{transform:scale(1.42) rotate(-2.5deg)}100%{transform:scale(1)}}
#combo .bar{width:100%;height:2px;margin-top:3px;background:rgba(255,46,136,.22)}
#combo .bar i{background:var(--magenta);box-shadow:0 0 10px var(--magenta);transition:none}
.reduce-motion #combo.pop{animation:none}
#hud-stats{display:flex;gap:14px}
#hud-fps{font-family:var(--font-m);font-size:11px;color:var(--dim)}
#hud-fps.hide{display:none}
#btn-pause{pointer-events:auto;background:rgba(9,15,29,.66)}

/* power-up chips */
#powerbar{display:flex;flex-direction:column;gap:5px}
.pu{
  display:flex;align-items:center;gap:8px;padding:5px 9px;min-width:132px;
  background:rgba(6,10,20,.6);border:1px solid var(--pc,var(--accent));
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  animation:puIn .3s cubic-bezier(.2,1.3,.3,1);
}
@keyframes puIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.pu .g{width:16px;height:16px;flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:var(--pc,var(--accent))}
.pu .n{font-family:var(--font-m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text);flex:1 1 auto}
.pu .t{font-family:var(--font-m);font-size:10px;color:var(--pc,var(--accent));font-variant-numeric:tabular-nums}
.pu .ring{position:absolute;left:0;bottom:0;height:2px;background:var(--pc,var(--accent));box-shadow:0 0 8px var(--pc,var(--accent))}
.pu{position:relative;overflow:hidden}
.pu.expiring{animation:puBlink .5s steps(2,end) infinite}
@keyframes puBlink{50%{opacity:.42}}
.reduce-motion .pu,.reduce-motion .pu.expiring{animation:none}

/* floating score popups + banners */
#popups{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.pop{
  position:absolute;transform:translate(-50%,-50%);
  font-family:var(--font-m);font-weight:700;font-size:clamp(13px,2.3vmin,19px);
  letter-spacing:.04em;white-space:nowrap;opacity:0;
  text-shadow:0 2px 10px rgba(0,0,0,.85);
}
#banner{
  position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:7;
  pointer-events:none;text-align:center;opacity:0;
}
#banner .big{font-size:clamp(26px,7vmin,62px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1}
#banner .small{font-family:var(--font-m);font-size:clamp(10px,1.7vmin,13px);letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-top:6px}
#banner.show{animation:bannerIn 1.5s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes bannerIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
  26%{transform:translate(-50%,-50%) scale(1)}
  76%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1)}
}

/* toasts + achievement popup */
#toasts{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(18px + var(--safe-b));z-index:30;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  width:min(440px,92vw);
}
.toast{
  font-family:var(--font-m);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:10px 16px;background:rgba(6,10,20,.9);border:1px solid var(--line-2);
  color:var(--text);text-align:center;animation:toastIn .3s ease-out;
}
.toast.warn{border-color:var(--amber);color:var(--amber)}
.toast.good{border-color:var(--ok);color:var(--ok)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(-8px);transition:opacity .3s ease,transform .3s ease}

#ach-pop{
  position:absolute;top:calc(16px + var(--safe-t));left:50%;z-index:31;
  transform:translate(-50%,-160%);
  display:flex;align-items:center;gap:13px;width:min(400px,92vw);
  padding:12px 16px;background:linear-gradient(120deg,rgba(10,18,34,.96),rgba(6,10,20,.92));
  border:1px solid var(--accent);box-shadow:0 0 60px -18px var(--accent);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  transition:transform .5s cubic-bezier(.2,1.2,.3,1);
}
#ach-pop.show{transform:translate(-50%,0)}
#ach-pop .badge{width:42px;height:42px;display:grid;place-items:center;font-size:20px;border:1px solid var(--accent);flex:0 0 auto}
#ach-pop .eyebrow{font-size:9.5px}
#ach-pop b{display:block;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
#ach-pop span{display:block;font-size:11.5px;color:var(--muted)}

/* =========================================================================
   Game over
   ========================================================================= */
#screen-over .sheet{width:min(560px,100%)}
#over-score{font-family:var(--font-m);font-weight:700;font-size:clamp(40px,11vmin,86px);line-height:1;color:#fff;text-shadow:0 0 40px var(--accent)}
#over-new{
  display:none;font-family:var(--font-m);font-size:11px;letter-spacing:.24em;color:#04121a;
  background:var(--accent);padding:4px 10px;text-transform:uppercase;
}
#over-new.on{display:inline-block;animation:newBest 1s ease-in-out infinite alternate}
@keyframes newBest{from{box-shadow:0 0 0 var(--accent)}to{box-shadow:0 0 26px var(--accent)}}
#over-title{color:var(--danger)}
#over-title.win{color:var(--ok)}
.reduce-motion #over-new.on{animation:none}

/* =========================================================================
   Touch controls
   ========================================================================= */
#touch{position:absolute;inset:0;z-index:3;display:none;touch-action:none}
#touch.on{display:block}
#dpad{
  position:absolute;right:calc(18px + var(--safe-r));bottom:calc(20px + var(--safe-b));
  width:clamp(132px,34vmin,196px);height:clamp(132px,34vmin,196px);
  display:none;opacity:.9;
}
#dpad.on{display:block}
#dpad button{
  position:absolute;width:36%;height:36%;padding:0;
  background:rgba(9,15,29,.5);border:1px solid var(--line-2);
  color:var(--accent);font-size:18px;line-height:1;cursor:pointer;
  display:grid;place-items:center;touch-action:none;
  transition:background .1s ease,transform .1s ease;
}
#dpad button:active,#dpad button.hit{background:var(--accent-soft);border-color:var(--accent);transform:scale(.94)}
#dpad .up{left:32%;top:0}
#dpad .dn{left:32%;bottom:0}
#dpad .lf{left:0;top:32%}
#dpad .rt{right:0;top:32%}
#dpad .hub{
  position:absolute;left:32%;top:32%;width:36%;height:36%;
  border:1px dashed rgba(126,196,255,.18);pointer-events:none;
}
#dpad svg{width:20px;height:20px;fill:currentColor;pointer-events:none}
#swipe-hint{
  position:absolute;left:50%;bottom:calc(26px + var(--safe-b));transform:translateX(-50%);
  font-family:var(--font-m);font-size:11px;letter-spacing:.2em;color:var(--dim);
  text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .4s ease;text-align:center;
}
#swipe-hint.on{opacity:1}

/* =========================================================================
   No-WebGL fallback
   ========================================================================= */
#nogl{
  position:absolute;inset:0;z-index:60;display:none;place-items:center;
  padding:28px;background:#04070f;text-align:center;
}
#nogl.on{display:grid}
#nogl .sheet{width:min(520px,100%);padding:26px;gap:14px}

/* =========================================================================
   Responsive
   ========================================================================= */
@media (max-width:760px){
  :root{--cut:11px}
  .sheet-body{padding:16px}
  .grid.g2{grid-template-columns:1fr}
  .grid.g3{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .grid.g4{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
  .btn .k{display:none}
  #hud-stats{gap:9px}
  #hud-tc .telemetry{display:none}
}
/* phone landscape: short viewport, keep menus scrollable and HUD slim */
@media (max-height:520px){
  .brand .wordmark{font-size:clamp(22px,7vmin,34px)}
  .brand .sub{letter-spacing:.3em}
  .sheet-head{padding:10px 16px}
  .sheet-body{padding:12px 16px}
  .sheet-foot{padding:10px 16px}
  .btn{min-height:42px;padding:9px 15px}
  .btn.big{min-height:48px}
  #screen-load .load-orbit{width:88px;height:88px}
  #hud{padding-top:calc(6px + var(--safe-t))}
  #over-score{font-size:clamp(30px,9vmin,44px)}
}
@media (max-width:420px){
  #hud-bl{max-width:64vw}
  .pu{min-width:112px}
  .pu .n{font-size:9px}
}
@media (hover:none){
  .btn:hover{background:rgba(255,255,255,.035);border-color:var(--line-2);color:var(--text)}
  .btn.primary:hover{background:linear-gradient(100deg,var(--accent-soft),rgba(124,92,255,.14));border-color:var(--accent);color:#fff}
  .card:hover{background:rgba(255,255,255,.028);border-color:var(--line)}
  .card.sel:hover{border-color:var(--accent);background:var(--accent-soft)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .screen,.screen>.sheet{transition-duration:.01ms}
}
</style>
