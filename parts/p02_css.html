<style>
/* =========================================================================
   Controls
   ========================================================================= */
.btn{
  --bw:1px;
  position:relative;display:inline-flex;align-items:center;gap:10px;
  min-height:48px;padding:12px 20px;
  font-family:var(--font-d);font-size:clamp(13px,1.9vmin,15px);font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--text);background:rgba(255,255,255,.035);
  border:var(--bw) solid var(--line-2);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  cursor:pointer;overflow:hidden;
  transition:background .18s ease,border-color .18s ease,color .18s ease,transform .1s ease;
  -webkit-appearance:none;appearance:none;
}
.btn::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);transform:scaleY(0);transform-origin:50% 50%;
  transition:transform .22s cubic-bezier(.2,.9,.25,1);
}
.btn:hover,.btn:focus-visible{background:var(--accent-soft);border-color:var(--accent);color:#fff;outline:none}
.btn:hover::before,.btn:focus-visible::before{transform:scaleY(1)}
.btn:focus-visible{box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 0 4px var(--accent)}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn .k{
  margin-left:auto;font-family:var(--font-m);font-size:11px;letter-spacing:.1em;
  color:var(--dim);padding-left:14px;
}
.btn:hover .k{color:var(--accent)}
.btn.primary{
  background:linear-gradient(100deg,var(--accent-soft),rgba(124,92,255,.14));
  border-color:var(--accent);color:#fff;
  box-shadow:0 0 30px -12px var(--accent);
}
.btn.primary::before{transform:scaleY(1)}
.btn.primary:hover{box-shadow:0 0 44px -10px var(--accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger:hover{border-color:var(--danger);background:rgba(255,77,109,.14)}
.btn.danger:hover::before{background:var(--danger)}
.btn.big{min-height:60px;font-size:clamp(15px,2.4vmin,19px);letter-spacing:.2em}
.btn.block{width:100%;justify-content:flex-start}
.btn.icon{min-height:44px;width:44px;padding:0;justify-content:center;gap:0}
.btn .ico{width:18px;height:18px;flex:0 0 auto;display:block}
.btn .ico path,.btn .ico circle,.btn .ico rect{fill:currentColor}

.menu-list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* segmented control ------------------------------------------------------- */
.seg{display:inline-flex;border:1px solid var(--line);background:rgba(0,0,0,.25);padding:3px;gap:3px}
.seg button{
  font-family:var(--font-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  min-height:36px;padding:0 12px;color:var(--muted);background:transparent;border:0;cursor:pointer;
  transition:background .16s ease,color .16s ease;
}
.seg button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.seg button[aria-checked="true"]{background:var(--accent);color:#04121a;font-weight:700}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* switch ------------------------------------------------------------------ */
.sw{
  position:relative;width:56px;height:30px;flex:0 0 auto;
  border:1px solid var(--line-2);background:rgba(0,0,0,.35);cursor:pointer;
  transition:background .2s ease,border-color .2s ease;
}
.sw::after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
  background:var(--dim);transition:transform .2s cubic-bezier(.3,.9,.3,1),background .2s ease;
}
.sw[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(26px);background:var(--accent);box-shadow:0 0 14px var(--accent)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* slider ------------------------------------------------------------------ */
input[type=range]{
  -webkit-appearance:none;appearance:none;width:min(200px,42vw);height:30px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(126,196,255,.22)}
input[type=range]::-moz-range-track{height:4px;background:rgba(126,196,255,.22)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-6px;
  background:var(--accent);border:0;box-shadow:0 0 12px var(--accent);
}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;background:var(--accent);box-shadow:0 0 12px var(--accent)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* settings rows ----------------------------------------------------------- */
.opt{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:13px 0;border-bottom:1px solid rgba(126,196,255,.09);
}
.opt:last-child{border-bottom:0}
.opt .lbl{flex:1 1 190px;min-width:150px}
.opt .lbl b{display:block;font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.opt .lbl span{display:block;font-size:12px;color:var(--dim);letter-spacing:.02em;text-transform:none}
.opt .val{font-family:var(--font-m);font-size:12px;color:var(--accent);min-width:44px;text-align:right}

/* =========================================================================
   Title lockup + telemetry signature
   ========================================================================= */
.brand{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.brand .wordmark{
  display:flex;align-items:baseline;gap:.34em;line-height:.92;
  font-size:clamp(30px,7.4vmin,66px);font-weight:700;letter-spacing:.02em;text-transform:uppercase;
}
.brand .wordmark .a{
  color:#fff;
  text-shadow:0 0 24px rgba(255,255,255,.25);
}
.brand .wordmark .b{
  color:var(--accent);
  text-shadow:0 0 34px var(--accent);
}
.brand .sub{
  font-family:var(--font-m);font-size:clamp(9px,1.5vmin,12px);letter-spacing:.42em;
  color:var(--muted);text-transform:uppercase;padding-left:2px;
}
/* the telemetry strip: a live waveform driven by real snake speed + combo */
.telemetry{position:relative;height:34px;width:100%;overflow:hidden;border-left:2px solid var(--accent)}
.telemetry canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.9}
.telemetry .tag{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  font-family:var(--font-m);font-size:10px;letter-spacing:.22em;color:var(--dim);
  padding-left:12px;background:linear-gradient(90deg,transparent,var(--bg) 40%);
}

/* =========================================================================
   Loading
   ========================================================================= */
#screen-load{background:radial-gradient(120% 100% at 50% 40%,#0d1730,#04070f 70%);z-index:40}
#screen-load .sheet{background:none;border:0;clip-path:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;align-items:center;gap:26px;width:min(560px,100%)}
.load-msg{font-family:var(--font-m);font-size:clamp(10px,1.7vmin,13px);letter-spacing:.28em;color:var(--muted);text-transform:uppercase;min-height:1.4em;text-align:center}
.bar{position:relative;width:100%;height:3px;background:rgba(126,196,255,.14);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,var(--violet),var(--aqua));box-shadow:0 0 18px var(--aqua);transition:width .25s ease}
.load-pct{font-family:var(--font-m);font-size:12px;color:var(--accent);letter-spacing:.2em}
#btn-enter{opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
#btn-enter.ready{opacity:1;transform:none;pointer-events:auto}
.load-orbit{width:132px;height:132px;position:relative}
.load-orbit i{
  position:absolute;inset:0;border:1px solid rgba(126,196,255,.18);border-radius:50%;
  border-top-color:var(--aqua);animation:spin 2.4s linear infinite;
}
.load-orbit i:nth-child(2){inset:16px;border-top-color:transparent;border-left-color:var(--violet);animation-duration:1.7s;animation-direction:reverse}
.load-orbit i:nth-child(3){inset:32px;border-top-color:transparent;border-right-color:var(--magenta);animation-duration:3.1s}
.load-orbit b{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-m);font-size:11px;letter-spacing:.2em;color:var(--dim);
}
@keyframes spin{to{transform:rotate(360deg)}}
.reduce-motion .load-orbit i{animation:none}
</style>
